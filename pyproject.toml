[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "culture-ocean"
version = "0.2.0"
description = "Generative real-time procedural ocean beach acoustic synthesizer modeled after Maui and Kauaʻi shorelines"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "numpy>=1.22.0",
    "scipy>=1.9.0",
]

[project.scripts]
culture-ocean = "culture_ocean:main"
maui-beach = "culture_ocean:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
